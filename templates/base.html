<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4" style="max-width: 480px;">
    {% if current_user.is_authenticated %}
    <nav class="d-flex flex-wrap gap-3 mb-3 pb-2 border-bottom">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('farms') }}">Farms</a>
      <a href="{{ url_for('crops') }}">Crops</a>
      <a href="{{ url_for('tasks') }}">Tasks</a>
      <a href="{{ url_for('logout') }}" class="ms-auto">Log out</a>
    </nav>
    {% endif %}
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
