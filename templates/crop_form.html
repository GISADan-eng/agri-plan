{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">{{ "Edit crop" if crop else "Add crop" }}</h1>
<form method="POST">
  <div class="mb-3">
    <label class="form-label" for="farm_id">Farm</label>
    <select class="form-select" id="farm_id" name="farm_id" required>
      {% for f in farms %}
        <option value="{{ f.id }}" {{ "selected" if crop and crop.farm_id == f.id }}>{{ f.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="name">Crop name</label>
    <input class="form-control" id="name" name="name" value="{{ crop.name if crop else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="planting_date">Planting date</label>
    <input class="form-control" type="date" id="planting_date" name="planting_date" value="{{ crop.planting_date if crop else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="expected_harvest_date">Expected harvest date</label>
    <input class="form-control" type="date" id="expected_harvest_date" name="expected_harvest_date" value="{{ crop.expected_harvest_date if crop else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="status">Status</label>
    <select class="form-select" id="status" name="status">
      {% for s in statuses %}
        <option value="{{ s }}" {{ "selected" if crop and crop.status == s }}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-success w-100" type="submit">Save</button>
</form>
{% endblock %}
